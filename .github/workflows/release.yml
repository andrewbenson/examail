name: Release

# Pushing a version tag (`scripts/release 0.3.0` does it) builds, signs and notarizes Exo, then
# publishes a GitHub release with the disk image and its checksum. Installed copies of Exo find
# it there and update themselves. Running it by hand builds the image without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build, sign and notarize Exo's disk image
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1.343.0
        with:
          bundler-cache: true

      - name: Build, sign and notarize
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          EXO_GOOGLE_CLIENT_ID: ${{ secrets.EXO_GOOGLE_CLIENT_ID }}
          EXO_GOOGLE_CLIENT_SECRET: ${{ secrets.EXO_GOOGLE_CLIENT_SECRET }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bundle exec fastlane release

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Exo
          retention-days: 14
          if-no-files-found: error
          path: |
            target/release/exo-v*-macos-arm64.dmg
            target/release/checksums.txt

  publish:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Exo
          path: dist

      - name: Publish Exo's disk image and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.dmg dist/checksums.txt --verify-tag --generate-notes --title "Exo $TAG"
