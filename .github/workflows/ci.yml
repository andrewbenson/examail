name: CI

on:
  push:
    branches: [main, build]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and test
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Two invite sign-in tests wait on a 60s deadline that a loaded runner can miss, so the
      # sign-in tests also run on their own, one at a time.
      - name: Run workspace tests
        run: >-
          cargo test --workspace --
          --skip an_invite_to_a_signed_out_calendar_account_signs_it_in_to_answer
          --skip signing_another_account_in_for_an_invite_says_so_and_no_thanks_puts_the_day_back
      - name: Run sign-in tests one at a time
        run: cargo test -p exo --test sign_in -- --test-threads=1
