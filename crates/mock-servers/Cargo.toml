[package]
name = "mock-servers"
description = "In-memory mock of the Google APIs Exo uses, and of Microsoft Graph serving the same mailbox, path- and wire-compatible with the real ones."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "dep:env_logger"]

[[bin]]
name = "mock-servers"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { workspace = true, optional = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
gmail = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
mail-parser = { workspace = true }
serde = { workspace = true }
serde_ignored = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
url = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
reqwest = { workspace = true }
roxmltree = { workspace = true }

[lints]
workspace = true
